<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aufzug-Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <h1>Aufzug-Simulator</h1>
        <div id="main">
            <div id="simulation-view">
                <canvas id="canvas"></canvas>
                <div id="floor-controls" role="group" aria-label="Passagiere pro Stockwerk hinzufügen"></div>
            </div>
            <div id="sidebar">
                <div id="controls">
                    <h3>Steuerung</h3>
                    <div class="control-group">
                        <label for="speedSlider">Geschwindigkeit: <span id="speedVal">2×</span></label>
                        <input type="range" id="speedSlider" min="0.1" max="10" value="2" step="0.1">
                    </div>
                    <div class="control-group">
                        <label>Passagierrate: <span id="spawnVal">3</span>/10s</label>
                        <input type="range" id="spawnSlider" min="0" max="10" value="3" step="1">
                    </div>
                    <div class="button-row">
                        <button id="pauseBtn">Pause</button>
                        <button id="resetBtn">Reset</button>
                    </div>
                    <div class="button-row">
                        <button id="addCabinBtn">+ Kabine</button>
                        <button id="removeCabinBtn">- Kabine</button>
                    </div>
                    <div id="cabinCount" class="program-note"></div>
                </div>
                <div id="stats">
                    <h3>Statistik</h3>
                    <div class="stat-row"><span>Gesamt:</span><span id="statTotal">0</span></div>
                    <div class="stat-row"><span>Wartend:</span><span id="statWaiting">0</span></div>
                    <div class="stat-row"><span>Fahrend:</span><span id="statRiding">0</span></div>
                    <div class="stat-row"><span>Fertig:</span><span id="statDone">0</span></div>
                    <div class="stat-row"><span>&empty; Wartezeit:</span><span id="statAvgWait">0s</span></div>
                    <div class="stat-row"><span>&empty; Gesamtzeit:</span><span id="statAvgTotal">0s</span></div>
                </div>
                <div id="elevator-status">
                    <h3>Aufz&uuml;ge</h3>
                    <div id="elevStatus"></div>
                </div>
            </div>
        </div>
        <section id="elevator-program" aria-labelledby="program-title">
            <h2 id="program-title">Kabinenprogramm</h2>
            <div id="programContent">Klicke auf eine Kabine oder einen Aufzug in der Seitenleiste, um seine geplanten Halte zu sehen.</div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
